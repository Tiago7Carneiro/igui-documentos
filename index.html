<style>
/* Layout: mesa de trabalho — formulário à esquerda, folha A4 timbrada à direita; registro em lista por categoria */
:root{
  --bg:#eef3f6; --surface:#ffffff; --field:#f7fafc; --desk:#dfe7ed; --line:#d3dee6;
  --fg:#13212d; --muted:#5a6b79; --head:#17324d; --blue:#0096d6; --blue-soft:#e1f3fb;
  --ok:#1f8a55; --ok-soft:#e2f4ea; --bad:#c0392b; --bad-soft:#fbe7e4;
  --paper:#ffffff; --ink:#1c1c1c; --ink-navy:#1f3864; --ink-gray:#6b7480; --rule:#cfd8e0; --tint:#f3f6f9; --ph:#9aa9b6; --ph-bg:#edf3f7;
  --ui:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --doc:"Arimo", Arial, Helvetica, sans-serif;
  --mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0d1820; --surface:#14222d; --field:#0f1c26; --desk:#09131a; --line:#243543;
  --fg:#e4edf3; --muted:#93a5b4; --head:#cfe4f3; --blue:#33bdf0; --blue-soft:#10303f;
  --ok:#4cc98a; --ok-soft:#12301f; --bad:#f07a6c; --bad-soft:#3a1814; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0d1820; --surface:#14222d; --field:#0f1c26; --desk:#09131a; --line:#243543;
  --fg:#e4edf3; --muted:#93a5b4; --head:#cfe4f3; --blue:#33bdf0; --blue-soft:#10303f;
  --ok:#4cc98a; --ok-soft:#12301f; --bad:#f07a6c; --bad-soft:#3a1814; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand img{width:44px;height:auto}
.brand b{display:block;font-size:15px;color:var(--head);letter-spacing:.01em}
.brand span{font-size:12px;color:var(--muted)}
nav.tabs{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{border:0;background:none;padding:8px 12px;border-radius:8px;font-weight:600;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-current="page"]{background:var(--blue-soft);color:var(--blue)}
nav.tabs .n{font-size:11px;font-variant-numeric:tabular-nums;margin-left:4px;opacity:.8}

main{padding-block:20px 60px}
h2{font-size:20px;margin:0 0 4px;color:var(--head);text-wrap:balance}
.sub{color:var(--muted);margin:0 0 16px;font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}

/* Novo documento */
.novo{display:grid;grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:940px){.novo{grid-template-columns:minmax(0,1fr)}}
.tipos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-bottom:16px}
.tipo{display:flex;align-items:center;gap:8px;text-align:left;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--field);font-weight:600;font-size:13.5px;min-width:0}
.tipo code{font-family:var(--mono);font-size:11px;padding:2px 5px;border-radius:5px;background:var(--surface);border:1px solid var(--line);color:var(--muted);flex:none}
.tipo span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tipo[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);color:var(--head)}
.tipo[aria-pressed="true"] code{color:var(--blue);border-color:var(--blue)}
.fields{display:grid;gap:12px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fld{display:grid;gap:5px;min-width:0}
.fld label{font-size:12.5px;font-weight:600;color:var(--muted)}
.fld label i{font-style:normal;color:var(--bad)}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);background:var(--field);border-radius:8px;padding:9px 10px;min-width:0}
.fld textarea{resize:vertical;line-height:1.45}
.fld.err input,.fld.err textarea,.fld.err select{border-color:var(--bad);background:var(--bad-soft)}
.fld small{font-size:12px;color:var(--muted)}
.hint{font-size:13px;padding:9px 11px;border-radius:8px;background:var(--blue-soft);color:var(--head)}
.hint.warn{background:var(--bad-soft);color:var(--bad)}
.sep{height:1px;background:var(--line);margin:4px 0}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:9px;font-weight:600;font-size:14px}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri.confirm{background:var(--head);border-color:var(--head);color:var(--surface)}
.btn.dan{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.ex{font-size:12px;font-weight:600;color:var(--blue);background:var(--blue-soft);padding:3px 8px;border-radius:99px}

.desk{background:var(--desk);border-radius:12px;padding:16px;min-width:0}
.desk-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.paper-fit{width:100%;overflow:hidden;display:flex;justify-content:center}
.paper-fit .page{box-shadow:0 2px 14px rgba(10,30,50,.18)}

/* Registro */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.chip b{font-variant-numeric:tabular-nums;margin-left:5px;color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--head);border-color:var(--head);color:var(--surface)}
.chip[aria-pressed="true"] b{color:var(--surface)}
.search{width:100%;max-width:380px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 12px;margin-bottom:12px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.li{display:grid;grid-template-columns:150px 96px 170px minmax(0,1fr) 96px;gap:12px;align-items:center;padding:11px 16px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left}
.li:first-child{border-top:0}
.li:hover{background:var(--field)}
.li.hd{font-size:12px;font-weight:600;color:var(--muted);background:var(--field);cursor:default}
.li .nm{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--head);font-variant-numeric:tabular-nums}
.li .dt{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13.5px}
.li .rs{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .rs small{color:var(--muted)}
.pill{justify-self:start;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--blue-soft);color:var(--blue)}
.pill.assinado{background:var(--ok-soft);color:var(--ok)}
.pill.cancelado{background:var(--bad-soft);color:var(--bad)}
@media (max-width:760px){
  .li{grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:12px 14px}
  .li.hd{display:none}
  .li .nm{grid-column:1}.li .pill{grid-column:2;grid-row:1;justify-self:end}
  .li .dt,.li .tp{font-size:12.5px}
  .li .tp{grid-column:1/-1;color:var(--muted)}
  .li .dt{grid-column:1/-1}
  .li .rs{grid-column:1/-1}
}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}
.viewer{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;align-items:start}
@media (max-width:940px){.viewer{grid-template-columns:minmax(0,1fr)}}
.meta{display:grid;gap:10px;font-size:14px}
.meta dt{font-size:12px;color:var(--muted);font-weight:600}
.meta dd{margin:0 0 4px}
.side-acts{display:grid;gap:8px}
.inline-confirm{display:grid;gap:8px;padding:12px;border:1px solid var(--bad);border-radius:9px;background:var(--bad-soft)}

/* Pessoas / Config */
.cols{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.pp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 16px;border-top:1px solid var(--line);align-items:center}
.pp:first-child{border-top:0}
.pp b{display:block}
.pp small{color:var(--muted)}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--field);border:1px solid var(--line);color:var(--muted)}
.tag.adv{color:var(--bad);border-color:var(--bad)}
.foot-note{font-size:12.5px;color:var(--muted);margin-top:14px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--head);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}

/* ===== Folha timbrada (A4) ===== */
.page{width:210mm;min-height:297mm;background:var(--paper);color:var(--ink);font-family:var(--doc);font-size:11.5pt;line-height:1.42;padding:13mm 20mm 11mm;display:flex;flex-direction:column;position:relative;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.lh{display:flex;align-items:center;gap:6mm}
.lh img{width:34mm;height:auto}
.lh .zs{font-weight:700;color:var(--ink-navy);font-size:12.5pt;letter-spacing:.02em}
.lh .tg{font-size:8.5pt;color:var(--ink-gray)}
.lh .nr{margin-left:auto;text-align:right;font-size:8pt;color:var(--ink-gray);text-transform:uppercase;letter-spacing:.06em}
.lh .nr b{display:block;font-size:11pt;color:var(--ink-navy);letter-spacing:.03em;text-transform:none;font-variant-numeric:tabular-nums}
.lh .nr em{display:block;font-style:normal;text-transform:none;letter-spacing:0}
.rule{border-top:1px solid var(--rule);margin:3mm 0 2.5mm}
.dtl{text-align:center;color:var(--ink-gray)}
.pbody{flex:1}
.pbody p{margin:0 0 3.2mm;text-align:justify;hyphens:auto}
.ttl{text-align:center;font-weight:700;color:var(--ink-navy);font-size:14pt;letter-spacing:.08em;margin:9mm 0 6mm}
.dest{color:var(--ink-navy);font-weight:700;margin-top:9mm}
.ass{color:var(--ink-navy);font-weight:700;font-size:13.5pt;margin:2mm 0 7mm}
.idt{border-collapse:collapse;width:100%;margin:0 0 6mm;font-size:10.5pt}
.idt td{padding:1.4mm 2.5mm;border-bottom:1px solid var(--rule);vertical-align:top}
.idt td:first-child{width:34mm;color:var(--ink-gray);font-size:9pt;text-transform:uppercase;letter-spacing:.04em;padding-top:1.9mm}
.box{border-left:2px solid var(--ink-navy);background:var(--tint);padding:2.5mm 4mm;margin:0 0 4mm}
.box p:last-child{margin-bottom:0}
.pbody ul{margin:0 0 4mm;padding-left:6mm}
.pbody li{margin-bottom:1mm}
.clos{margin-top:8mm}
.clos p{margin:0 0 1mm}
.clos .cn{color:var(--ink-navy);font-weight:700;font-size:12.5pt}
.sigs{display:grid;grid-template-columns:1fr 1fr;gap:15mm 12mm;margin-top:16mm;break-inside:avoid}
.sigs.one{grid-template-columns:1fr;max-width:95mm;margin-left:auto;margin-right:auto;text-align:center}
.sig .ln{border-top:1px solid var(--ink);margin-bottom:1.5mm}
.sig b{display:block;font-size:10pt}
.sig span{display:block;font-size:8.8pt;color:var(--ink-gray)}
.nota{font-size:8.8pt;color:var(--ink-gray);margin-top:8mm!important}
.rtop{display:flex;align-items:center;justify-content:space-between;gap:8mm;margin:9mm 0 7mm}
.rtop .ttl{margin:0;text-align:left}
.valor{border:1.5px solid var(--ink-navy);color:var(--ink-navy);font-weight:700;font-size:15pt;padding:2.5mm 5mm;font-variant-numeric:tabular-nums;white-space:nowrap}
.pfoot{margin-top:8mm;padding-top:3mm;border-top:1px solid var(--rule);display:flex;justify-content:space-between;align-items:flex-end;gap:8mm;font-size:7.5pt;color:var(--ink-gray);line-height:1.5}
.pfoot .fn{font-variant-numeric:tabular-nums;white-space:nowrap}
.ph{color:var(--ph);background:var(--ph-bg);border-radius:2px;padding:0 1mm}
.wm{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;overflow:hidden}
.wm span{transform:rotate(-28deg);font-family:var(--doc);font-weight:700;font-size:62pt;letter-spacing:.1em;padding:2mm 8mm;border:5px solid currentColor;border-radius:4mm}
.wm.rasc span{color:rgba(0,150,214,.10)}
.wm.canc span{color:rgba(192,57,43,.22)}

#printArea{display:none}
@page{size:A4;margin:0}
@media print{
  body{background:#fff}
  body::before{display:none}
  body > *:not(#printArea){display:none!important}
  #printArea{display:block}
  #printArea .page{zoom:1!important;box-shadow:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

const U=["","um","dois","três","quatro","cinco","seis","sete","oito","nove","dez","onze","doze","treze","quatorze","quinze","dezesseis","dezessete","dezoito","dezenove"];
const D=["","","vinte","trinta","quarenta","cinquenta","sessenta","setenta","oitenta","noventa"];
const C=["","cento","duzentos","trezentos","quatrocentos","quinhentos","seiscentos","setecentos","oitocentos","novecentos"];
function tri(n){if(!n)return"";if(n===100)return"cem";const p=[],h=Math.floor(n/100),r=n%100;if(h)p.push(C[h]);if(r){if(r<20)p.push(U[r]);else{const dz=Math.floor(r/10),un=r%10;p.push(un?D[dz]+" e "+U[un]:D[dz])}}return p.join(" e ")}
function inteiro(n){
  if(!n)return"zero";
  const G=[];while(n>0){G.push(n%1000);n=Math.floor(n/1000)}
  const NM=[["",""],["mil","mil"],["milhão","milhões"],["bilhão","bilhões"]];
  const P=[];for(let g=G.length-1;g>=0;g--){const v=G[g];if(!v)continue;P.push({g,v,t:g===1&&v===1?"mil":tri(v)+(g?" "+(v===1?NM[g][0]:NM[g][1]):"")})}
  return P.map((p,i)=>i===0?p.t:((p.v<100||p.v%100===0)&&i===P.length-1?" e ":" ")+p.t).join("");
}
function extenso(v){
  v=Math.round((v||0)*100)/100;const r=Math.floor(v),c=Math.round((v-r)*100);
  let s="";
  if(r){s=inteiro(r)+(r%1000000===0?" de":"")+(r===1?" real":" reais")}
  if(c){s+=(s?" e ":"")+inteiro(c)+(c===1?" centavo":" centavos")}
  return s||"zero real";
}

const orig=()=>ed&&S.docs.find(x=>x.id===ed.id);
function novoRasc(t){const f={};allFields(t).forEach(x=>{if(x.def!==undefined)f[x.k]=x.def});if(t==="NOT")f.assinante=S.cfg.representante;if(allFields(t).some(x=>x.k==="sign")){const g=S.signatarios[0];if(g){f.signNome=g.nome;f.signCargo=g.cargo}}if(t==="SUS")f.inicio=hoje();return{data:hoje(),local:S.cfg.cidade,f}}
ORDEM.forEach(t=>rasc[t]=novoRasc(t));
rasc.COM.exemplo=true;
Object.assign(rasc.COM.f,{destinatario:"À Equipe iGUi Zona Sul",assunto:"Funcionamento da loja no feriado de Finados",
 corpo:"Informamos que, no feriado de Finados, segunda-feira, 2 de novembro de 2026, a loja funcionará conforme o horário definido pelo Shopping Fashion Mall.\nA escala de plantão será divulgada pela gerência até sexta-feira, 30 de outubro. Pedimos que cada consultor confirme sua disponibilidade até essa data.\nContamos com a colaboração de todos."});

function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2800)}
function fit(){document.querySelectorAll(".paper-fit").forEach(w=>{const p=w.firstElementChild;if(p){p.style.zoom=1;const s=Math.min(1,w.clientWidth/p.offsetWidth);p.style.zoom=s}})}
addEventListener("resize",()=>{cancelAnimationFrame(fit.r);fit.r=requestAnimationFrame(fit)});

function tabs(){const n=S.docs.length;
  $("#tabs").innerHTML=[["novo","Novo documento"],["registro",`Registro<span class="n">${n}</span>`],["pessoas","Pessoas"],["config","Configurações"]]
   .map(([k,l])=>`<button data-act="tab" data-v="${k}" ${view===k?'aria-current="page"':""}>${l}</button>`).join("")}
function render(){tabs();const m=$("#main");
  if(view==="novo")m.innerHTML=vNovo();else if(view==="registro")m.innerHTML=verId?vVer():vReg();else if(view==="pessoas")m.innerHTML=vPessoas();else m.innerHTML=vConfig();
  fit()}

/* ---------- NOVO ---------- */
function campo(x,d){
  const id="f_"+x.k,v=d.f[x.k]??"",lab=`<label for="${id}">${esc(x.l)}${x.req?" <i>*</i>":""}</label>`;
  const ph=x.ph?` placeholder="${esc(x.ph)}"`:"";
  if(x.t==="pessoa"){const T=TIPOS[tipo];const ps=S.pessoas.filter(p=>T.papeis.includes(p.papel));
    return `<div class="fld"><label for="${id}">Preencher com ${esc(x.l.toLowerCase())} cadastrado</label><select id="${id}" data-pessoa><option value="">Selecionar…</option>${ps.map(p=>`<option value="${p.id}" ${d.f.pessoa===p.id?"selected":""}>${esc(p.nome)}${p.cargo?" — "+esc(p.cargo):""}</option>`).join("")}</select>${ps.length?"":`<small>Nenhum cadastro deste tipo. Adicione em Pessoas.</small>`}</div>`}
  if(x.t==="sign"){const L=S.signatarios,sel=L.find(g=>g.nome===d.f.signNome&&g.cargo===d.f.signCargo);
    return `<div class="fld"><label for="${id}">${esc(x.l)}</label><select id="${id}" data-sign>${L.map(g=>`<option value="${g.id}" ${sel&&sel.id===g.id?"selected":""}>${esc(g.nome)}${g.cargo?" — "+esc(g.cargo):""}</option>`).join("")}<option value="" ${sel?"":"selected"}>Outra pessoa…</option></select></div>
    ${sel?"":`<div class="row2">${campo({k:"signNome",l:"Nome de quem assina",req:1},d)}${campo({k:"signCargo",l:"Cargo"},d)}</div>`}<small style="font-size:12px;color:var(--muted);margin-top:-6px">Cadastre quem pode assinar em Configurações.</small>`}
  let inp;
  if(x.t==="area")inp=`<textarea id="${id}" data-k="${x.k}" rows="${x.rows||4}"${ph}>${esc(v)}</textarea>`;
  else if(x.t==="select")inp=`<select id="${id}" data-k="${x.k}" data-re>${x.opts.map(o=>`<option ${o===v?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
  else inp=`<input id="${id}" data-k="${x.k}" value="${esc(v)}" type="${x.t==="date"?"date":"text"}"${x.t==="num"?' inputmode="numeric"':x.t==="money"?' inputmode="decimal"':""}${ph}>`;
  return `<div class="fld" data-f="${x.k}">${lab}${inp}${x.h?`<small>${esc(x.h)}</small>`:""}</div>`;
}
function dica(){const d=cur(),f=d.f;
  if(tipo==="ADV"||tipo==="SUS"){const a=antecedentes(ed?{f,id:ed.id,criadoEm:orig().criadoEm}:{f,id:null});
    let s=a.length?`<div class="hint warn">${esc(f.nome)} já tem ${a.length} medida${a.length>1?"s":""} registrada${a.length>1?"s":""}: ${a.map(x=>x.num).join(", ")}. Isso entra no texto automaticamente.</div>`:"";
    if(tipo==="SUS"&&parseInt(f.dias)>30)s+=`<div class="hint warn">A CLT limita a suspensão a 30 dias consecutivos (art. 474). Acima disso, a lei considera rescisão injusta.</div>`;
    return s}
  if(tipo==="ADI"){const va=parseBR(f.valorAnt),vn=parseBR(f.valorNovo),n=adSeq(ed?{f,id:ed.id,criadoEm:orig().criadoEm,seqAd:orig().seqAd}:{f});
    return `${f.contrato?`<div class="hint">Este será o ${n}º aditivo do contrato ${esc(f.contrato)}.</div>`:""}${va&&vn&&vn!==va?`<div class="hint">${vn>va?"Acréscimo":"Redução"} de ${brl(Math.abs(vn-va))}</div>`:""}`}
  if(tipo==="REC"&&parseBR(f.valor))return `<div class="hint">${esc(brl(parseBR(f.valor)))} — ${esc(extenso(parseBR(f.valor)))}</div>`;
  return "";
}
function vNovo(){const T=TIPOS[tipo],d=cur();
  const flds=T.fields.filter(x=>!x.show||x.show(d.f)).map(x=>x.r?`<div class="row2">${x.r.map(y=>campo(y,d)).join("")}</div>`:campo(x,d)).join("");
  return `<div class="novo">
   <section class="panel">
    ${ed?`<h2>Editar <span style="font-family:var(--mono)">${orig().num}</span></h2><p class="sub">${TIPOS[tipo].nome} · o número continua o mesmo e a alteração fica no histórico.</p>${orig().status==="assinado"?`<div class="hint warn" style="margin-bottom:14px">Este documento já foi assinado. Ao salvar, ele volta para Emitido, para você imprimir e colher a assinatura de novo.</div>`:""}`:`<h2>Novo documento</h2><p class="sub">Escolha o tipo, preencha e emita. O número é gerado na emissão.</p>`}
    <div class="tipos" ${ed?"hidden":""}>${ORDEM.map(t=>`<button class="tipo" data-act="tipo" data-v="${t}" aria-pressed="${t===tipo}"><code>${t}</code><span>${TIPOS[t].curto}</span></button>`).join("")}</div>
    <div class="fields">
     <div class="row2"><div class="fld"><label for="d_data">Data do documento</label><input type="date" id="d_data" value="${d.data}"></div>
      <div class="fld"><label for="d_local">Local</label><input id="d_local" value="${esc(d.local)}"></div></div>
     <div class="sep"></div>
     ${flds}
     <div id="dica">${dica()}</div>
    </div>
    <div class="acts">
     ${ed?`<button class="btn pri" data-act="salvarEd">Salvar alterações</button><button class="btn" data-act="descartarEd">Descartar</button>`:`<button class="btn pri ${armado?"confirm":""}" data-act="emitir">${armado?`Confirmar emissão do ${proxNum(tipo,d.data)}`:"Emitir e registrar"}</button>
     <button class="btn" data-act="limpar">Limpar</button>`}
    </div>
   </section>
   <section class="desk"><div class="desk-h"><span>${ed?"Como vai ficar":"Pré-visualização"} · ${esc(T.nome)}</span>${d.exemplo?`<span class="ex">Exemplo — edite ou clique em Limpar</span>`:""}</div>
    <div class="paper-fit" id="prev">${paper(prevDoc())}</div></section>
  </div>`;
}
function prevDoc(){const d=cur();if(!ed)return{tipo,data:d.data,local:d.local,f:d.f};const o=orig();return{...o,ant:undefined,seqAd:norm(o.f.contrato)===norm(d.f.contrato)?o.seqAd:undefined,data:d.data,local:d.local,f:d.f,status:"emitido"}}
function atualizaPrev(){$("#prev").innerHTML=paper(prevDoc());$("#dica").innerHTML=dica();fit()}
function emitir(){
  const d=cur(),T=TIPOS[tipo];let falta=[];
  document.querySelectorAll(".fld.err").forEach(e=>e.classList.remove("err"));
  T.fields.filter(x=>!x.show||x.show(d.f)).flatMap(x=>x.r||[x]).forEach(x=>{if(x.req&&!String(d.f[x.k]??"").trim()){falta.push(x.l);const el=document.querySelector(`[data-f="${x.k}"]`);el&&el.classList.add("err")}});
  if(tipo==="REC"&&d.f.valor&&!parseBR(d.f.valor))falta.push("Valor válido");
  if(T.fields.some(x=>x.k==="sign"&&(!x.show||x.show(d.f)))&&!String(d.f.signNome||"").trim()){falta.push("Quem assina");const el=document.querySelector('[data-f="signNome"]');el&&el.classList.add("err")}
  if(!d.data)falta.push("Data do documento");
  if(ed)return falta;
  if(falta.length){armado=null;toast("Preencha: "+falta.join(", "));const b=document.querySelector('[data-act="emitir"]');b&&(b.className="btn pri",b.textContent="Emitir e registrar");return}
  if(!armado){armado=setTimeout(()=>{armado=null;const b=document.querySelector('[data-act="emitir"]');if(b){b.className="btn pri";b.textContent="Emitir e registrar"}},5000);
    const b=document.querySelector('[data-act="emitir"]');b.className="btn pri confirm";b.textContent=`Confirmar emissão do ${proxNum(tipo,d.data)}`;return}
  clearTimeout(armado);armado=null;
  const ano=d.data.slice(0,4),k=`${tipo}-${ano}`,seq=(S.cont[k]||0)+1;S.cont[k]=seq;
  const f={...d.f};delete f.pessoa;
  const doc={id:uid(),tipo,num:`${tipo}-${ano}-${pad3(seq)}`,data:d.data,local:d.local,f,cfg:{...S.cfg},status:"emitido",criadoEm:new Date().toISOString()};
  if(tipo==="ADV"||tipo==="SUS")doc.ant=antecedentes({f,id:null});
  if(tipo==="ADI")doc.seqAd=adSeq({f});
  S.docs.unshift(doc);save();rasc[tipo]=novoRasc(tipo);
  view="registro";verId=doc.id;render();toast(`${doc.num} emitido e registrado`);scrollTo(0,0);
}

const ROT={data:"Data do documento",local:"Local",signNome:"Quem assina",signCargo:"Cargo de quem assina"};
const rot=(t,k)=>ROT[k]||(allFields(t).find(x=>x.k===k)||{}).l||k;
function difs(t,a,b){const ks=new Set([...Object.keys(a.f),...Object.keys(b.f)]);const o=[];if(a.data!==b.data)o.push("data");if((a.local||"")!==(b.local||""))o.push("local");
  ks.forEach(k=>{if(k!=="pessoa"&&String(a.f[k]??"")!==String(b.f[k]??""))o.push(k)});return [...new Set(o.map(k=>rot(t,k)))]}
function editar(d){ed={id:d.id,data:d.data,local:d.local,f:{...d.f}};tipo=d.tipo;view="novo";verId=null;cancelando=false;render();scrollTo(0,0)}
function salvarEd(){const o=orig();if(!o){ed=null;render();return}
  const falta=emitir();if(falta.length){toast("Preencha: "+falta.join(", "));return}
  const ch=difs(o.tipo,o,ed);if(!ch.length){toast("Nenhuma alteração para salvar");return}
  (o.versoes=o.versoes||[]).push({em:new Date().toISOString(),data:o.data,local:o.local,f:o.f,campos:ch,status:o.status});
  const f={...ed.f};delete f.pessoa;Object.assign(o,{data:ed.data,local:ed.local,f,editadoEm:new Date().toISOString()});
  if(o.tipo==="ADV"||o.tipo==="SUS")o.ant=antecedentes({f,id:o.id,criadoEm:o.criadoEm});
  if(o.tipo==="ADI"&&ch.includes(rot("ADI","contrato"))){delete o.seqAd;o.seqAd=adSeq({f,id:o.id,criadoEm:o.criadoEm})}
  const eraAss=o.status==="assinado";if(eraAss){o.status="emitido";delete o.assinadoEm}
  save();ed=null;view="registro";verId=o.id;render();scrollTo(0,0);toast(eraAss?`${o.num} alterado. Imprima e colha a assinatura de novo.`:`${o.num} alterado`)}

/* ---------- REGISTRO ---------- */
const resumo=d=>TIPOS[d.tipo].resumo(d.f)||"—";
function vReg(){
  const cont={};S.docs.forEach(d=>cont[d.tipo]=(cont[d.tipo]||0)+1);
  const q=norm(busca);
  const L=S.docs.filter(d=>(filtro==="todos"||d.tipo===filtro)&&(!q||norm(d.num+" "+resumo(d)+" "+TIPOS[d.tipo].nome).includes(q)));
  return `<h2>Registro de documentos</h2><p class="sub">Tudo que foi emitido, do mais recente para o mais antigo. Documentos cancelados mantêm o número.</p>
  <div class="chips"><button class="chip" data-act="filtro" data-v="todos" aria-pressed="${filtro==="todos"}">Todos<b>${S.docs.length}</b></button>
  ${ORDEM.map(t=>`<button class="chip" data-act="filtro" data-v="${t}" aria-pressed="${filtro===t}">${TIPOS[t].curto}<b>${cont[t]||0}</b></button>`).join("")}</div>
  <input class="search" id="busca" placeholder="Buscar por número, nome ou assunto" value="${esc(busca)}">
  <div class="list">${L.length?`<div class="li hd"><span>Número</span><span>Data</span><span>Tipo</span><span>Destinatário / assunto</span><span>Situação</span></div>`+
   L.map(d=>`<button class="li" data-act="ver" data-v="${d.id}"><span class="nm">${d.num}</span><span class="dt">${br(d.data)}</span><span class="tp">${TIPOS[d.tipo].nome}</span><span class="rs">${esc(resumo(d))}${d.versoes?.length?` <small>· alterado</small>`:""}</span><span class="pill ${d.status}">${{emitido:"Emitido",assinado:"Assinado",cancelado:"Cancelado"}[d.status]}</span></button>`).join("")
   :S.docs.length?`<div class="empty"><b>Nada encontrado</b>Tente outro filtro ou outra busca.</div>`
   :`<div class="empty"><b>Nenhum documento emitido ainda</b>Os documentos aparecem aqui assim que você clicar em Emitir e registrar, já numerados por categoria (ex.: ADV-2026-001).<div class="acts" style="justify-content:center"><button class="btn pri" data-act="tab" data-v="novo">Criar o primeiro documento</button></div></div>`}</div>`;
}
function vVer(){const d=S.docs.find(x=>x.id===verId);if(!d){verId=null;return vReg()}
  const st={emitido:"Emitido",assinado:"Assinado",cancelado:"Cancelado"}[d.status];
  return `<div class="acts" style="margin:0 0 14px"><button class="btn sm" data-act="voltar">← Registro</button></div>
  <div class="viewer"><section class="desk"><div class="paper-fit">${paper(d)}</div></section>
  <aside class="panel"><h2 style="font-family:var(--mono);font-size:18px">${d.num}</h2><p class="sub">${TIPOS[d.tipo].nome}</p>
   <dl class="meta"><div><dt>Situação</dt><dd><span class="pill ${d.status}">${st}</span>${d.status==="assinado"&&d.assinadoEm?` em ${br(d.assinadoEm)}`:""}</dd></div>
   <div><dt>Data do documento</dt><dd>${br(d.data)}</dd></div><div><dt>Para</dt><dd>${esc(resumo(d))}</dd></div>
   <div><dt>Registrado em</dt><dd>${new Date(d.criadoEm).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"})}</dd></div>
   ${d.versoes?.length?`<div><dt>Histórico de alterações</dt><dd><ul style="margin:2px 0 0;padding-left:16px;display:grid;gap:4px;font-size:13px">${d.versoes.map(v=>`<li>${new Date(v.em).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"})} — ${esc(v.campos.join(", "))}</li>`).join("")}</ul></dd></div>`:""}
   ${d.status==="cancelado"?`<div><dt>Motivo do cancelamento</dt><dd>${esc(d.motivoCancel||"—")} (${br(d.canceladoEm)})</dd></div>`:""}</dl>
   <div class="side-acts" style="margin-top:16px">
    <button class="btn pri" data-act="imprimir">Imprimir / salvar PDF</button>
    ${d.status==="emitido"?`<button class="btn" data-act="assinado">Marcar como assinado</button>`:d.status==="assinado"?`<button class="btn" data-act="desassinar">Voltar para emitido</button>`:""}
    ${d.status!=="cancelado"?`<button class="btn" data-act="editar">Editar documento</button>`:""}
    <button class="btn" data-act="duplicar">Usar como modelo</button>
    ${d.status!=="cancelado"?(cancelando?`<div class="inline-confirm"><label for="motivoC" style="font-size:13px;font-weight:600">Motivo do cancelamento</label><input id="motivoC" class="search" style="margin:0;max-width:none" placeholder="Ex.: dados do destinatário incorretos"><div class="acts" style="margin:0"><button class="btn dan sm" data-act="cancelarOk">Cancelar documento</button><button class="btn sm" data-act="cancelarNao">Voltar</button></div><small style="font-size:12px;color:var(--bad)">O número ${d.num} fica reservado e não será reutilizado.</small></div>`:`<button class="btn dan" data-act="cancelar">Cancelar documento</button>`):""}
   </div>
   <p class="foot-note">Ao editar, o número continua o mesmo e cada alteração fica registrada no histórico, com data, hora e os campos mudados. Para trocar o tipo de documento, cancele e use como modelo.</p>
  </aside></div>`;
}
function imprimir(d){const t=document.title;$("#printArea").innerHTML=paper(d);document.title=`${d.num} - ${resumo(d)}`.replace(/[\/\\:*?"<>|]/g,"-");
  setTimeout(()=>{try{window.print()}catch(e){}document.title=t},60)}

/* ---------- PESSOAS ---------- */
function vPessoas(){const p=pEdit?S.pessoas.find(x=>x.id===pEdit)||{}:{};
  const dc=x=>S.docs.filter(d=>d.status!=="cancelado"&&norm(d.f.nome)===norm(x.nome));
  const L=[...S.pessoas].sort((a,b)=>a.papel.localeCompare(b.papel)||a.nome.localeCompare(b.nome));
  return `<div class="cols"><section class="panel"><h2>${pEdit?"Editar cadastro":"Novo cadastro"}</h2><p class="sub">Funcionários, clientes e prestadores para preencher os documentos com um toque.</p>
   <div class="fields">
    <div class="fld"><label for="p_nome">Nome completo <i>*</i></label><input id="p_nome" value="${esc(p.nome||"")}"></div>
    <div class="row2"><div class="fld"><label for="p_papel">Tipo</label><select id="p_papel">${papelAll.map(o=>`<option ${o===(p.papel||"Funcionário")?"selected":""}>${o}</option>`).join("")}</select></div>
     <div class="fld"><label for="p_cpf">CPF ou CNPJ</label><input id="p_cpf" value="${esc(p.cpf||"")}" inputmode="numeric"></div></div>
    <div class="row2"><div class="fld"><label for="p_cargo">Cargo</label><input id="p_cargo" value="${esc(p.cargo||"")}"></div>
     <div class="fld"><label for="p_adm">Admissão</label><input id="p_adm" type="date" value="${esc(p.admissao||"")}"></div></div>
    <div class="fld"><label for="p_end">Endereço</label><input id="p_end" value="${esc(p.endereco||"")}"></div>
   </div>
   <div class="acts"><button class="btn pri" data-act="pSalvar">${pEdit?"Salvar alterações":"Adicionar"}</button>${pEdit?`<button class="btn" data-act="pNovo">Cancelar edição</button>`:""}</div></section>
   <section><div class="list">${L.length?L.map(x=>{const ds=dc(x),na=ds.filter(d=>d.tipo==="ADV").length,ns=ds.filter(d=>d.tipo==="SUS").length;
     return `<div class="pp"><div style="min-width:0"><b>${esc(x.nome)}</b><small>${esc(x.papel)}${x.cargo?" · "+esc(x.cargo):""}${x.cpf?" · "+esc(x.cpf):""}</small>
     <div class="tags">${ds.length?`<span class="tag">${ds.length} documento${ds.length>1?"s":""}</span>`:""}${na?`<span class="tag adv">${na} advertência${na>1?"s":""}</span>`:""}${ns?`<span class="tag adv">${ns} ${ns>1?"suspensões":"suspensão"}</span>`:""}</div></div>
     <div class="acts" style="margin:0">${apagando===x.id?`<button class="btn dan sm" data-act="pDelOk" data-v="${x.id}">Confirmar exclusão</button><button class="btn sm" data-act="pDelNao">Não</button>`:`<button class="btn sm" data-act="pEdit" data-v="${x.id}">Editar</button><button class="btn sm" data-act="pDel" data-v="${x.id}">Excluir</button>`}</div></div>`}).join("")
    :`<div class="empty"><b>Nenhum cadastro</b>Adicione funcionários e clientes ao lado.</div>`}</div>
    <p class="foot-note">Excluir um cadastro não altera documentos já emitidos.</p></section></div>`;
}

/* ---------- CONFIG ---------- */
const CF=[["nomeFantasia","Nome fantasia"],["razao","Razão social"],["cnpj","CNPJ"],["endereco","Endereço (rodapé)"],["contato","Contato no rodapé (telefone, e-mail, Instagram)"],["representante","Representante legal"],["cargoRep","Cargo do representante"],["cidade","Cidade padrão"]];
function vConfig(){return `<div class="cols"><section class="panel"><h2>Dados da empresa</h2><p class="sub">Aparecem no rodapé e nas assinaturas. Mudanças valem só para documentos novos.</p>
  <div class="fields">${CF.map(([k,l])=>`<div class="fld"><label for="c_${k}">${l}</label><input id="c_${k}" data-cfg="${k}" value="${esc(S.cfg[k]||"")}"></div>`).join("")}</div></section>
  <div style="display:grid;gap:20px;min-width:0"><section class="panel"><h2>Quem assina pela empresa</h2><p class="sub">Aparecem como opção nos documentos. O primeiro da lista é o padrão.</p>
   <div class="list" style="margin-bottom:14px">${S.signatarios.map((g,i)=>`<div class="pp"><div style="min-width:0"><b>${esc(g.nome)}</b><small>${esc(g.cargo||"—")}${i===0?" · padrão":""}</small></div><div class="acts" style="margin:0">${i>0?`<button class="btn sm" data-act="sPad" data-v="${g.id}">Tornar padrão</button>`:""}${S.signatarios.length>1?`<button class="btn sm" data-act="sDel" data-v="${g.id}">Remover</button>`:""}</div></div>`).join("")}</div>
   <div class="row2"><div class="fld"><label for="s_nome">Nome</label><input id="s_nome" placeholder="Ex.: nome do gerente"></div><div class="fld"><label for="s_cargo">Cargo</label><input id="s_cargo" placeholder="Ex.: Gerente Comercial"></div></div>
   <div class="acts"><button class="btn pri" data-act="sAdd">Adicionar</button></div></section>
  <section class="panel"><h2>Backup</h2><p class="sub">Os documentos ficam salvos neste aparelho. Baixe um backup com frequência e guarde no Drive ou no e-mail.</p>
   <div class="acts"><button class="btn pri" data-act="exportar">Baixar backup (.json)</button><label class="btn" for="imp" style="display:inline-block">Restaurar backup</label><input type="file" id="imp" accept=".json,application/json" hidden></div>
   <div class="sep" style="margin:16px 0 12px"></div>
   <h2 style="font-size:16px">Transferir por texto</h2><p class="sub" style="margin-bottom:10px">Para passar os dados de um lugar para outro sem arquivo: copie aqui, cole no outro aparelho ou endereço.</p>
   <div class="acts" style="margin:0 0 10px"><button class="btn" data-act="copiarBk">Copiar backup (${S.docs.length} documentos)</button></div>
   <div class="fld"><label for="colaBk">Colar backup</label><textarea id="colaBk" rows="3" placeholder="Cole aqui o texto do backup copiado"></textarea></div>
   <div class="acts" style="margin-top:8px"><button class="btn" data-act="restTexto">Restaurar do texto colado</button></div>
   ${importando?`<div class="inline-confirm" style="margin-top:12px"><span style="font-size:14px">Restaurar o backup com <b>${importando.docs.length} documentos</b> e ${importando.pessoas?.length||0} cadastros? Os dados atuais deste aparelho${S.docs.length?` (${S.docs.length} documento${S.docs.length>1?"s":""})`:""} serão substituídos.</span><div class="acts" style="margin:0"><button class="btn dan sm" data-act="impOk">Substituir dados</button><button class="btn sm" data-act="impNao">Cancelar</button></div></div>`:""}
   <p class="foot-note">Numeração atual: ${Object.keys(S.cont).length?Object.entries(S.cont).sort().map(([k,v])=>`${k}-${pad3(v)}`).join(" · "):"nenhum documento emitido"}.</p></section></div></div>`}

/* ---------- eventos ---------- */
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,v=b.dataset.v;
  if(a==="tab"){ed=null;view=v;verId=null;cancelando=false;render();return}
  if(a==="tipo"){tipo=v;clearTimeout(armado);armado=null;render();return}
  if(a==="emitir")return emitir();
  if(a==="salvarEd")return salvarEd();
  if(a==="descartarEd"){const id=ed.id;ed=null;view="registro";verId=id;render();toast("Alterações descartadas");return}
  if(a==="limpar"){rasc[tipo]=novoRasc(tipo);render();return}
  if(a==="filtro"){filtro=v;render();return}
  if(a==="ver"){verId=v;cancelando=false;render();scrollTo(0,0);return}
  if(a==="voltar"){verId=null;cancelando=false;render();return}
  const d=S.docs.find(x=>x.id===verId);
  if(a==="imprimir"&&d)return imprimir(d);
  if(a==="assinado"&&d){d.status="assinado";d.assinadoEm=hoje();save();render();toast(`${d.num} marcado como assinado`);return}
  if(a==="desassinar"&&d){d.status="emitido";delete d.assinadoEm;save();render();return}
  if(a==="editar"&&d)return editar(d);
  if(a==="duplicar"&&d){tipo=d.tipo;rasc[tipo]={data:hoje(),local:S.cfg.cidade,f:{...d.f}};view="novo";verId=null;render();toast("Copiado para um novo rascunho");return}
  if(a==="cancelar"){cancelando=true;render();$("#motivoC")?.focus();return}
  if(a==="cancelarNao"){cancelando=false;render();return}
  if(a==="cancelarOk"&&d){d.status="cancelado";d.motivoCancel=$("#motivoC").value.trim();d.canceladoEm=hoje();cancelando=false;save();render();toast(`${d.num} cancelado`);return}
  if(a==="pSalvar"){const nome=$("#p_nome").value.trim();if(!nome){$("#p_nome").closest(".fld").classList.add("err");toast("Informe o nome");return}
    const o={nome,papel:$("#p_papel").value,cpf:$("#p_cpf").value.trim(),cargo:$("#p_cargo").value.trim(),admissao:$("#p_adm").value,endereco:$("#p_end").value.trim()};
    if(pEdit)Object.assign(S.pessoas.find(x=>x.id===pEdit),o);else S.pessoas.push({id:uid(),...o});
    toast(pEdit?"Cadastro atualizado":"Cadastro adicionado");pEdit=null;save();render();return}
  if(a==="pEdit"){pEdit=v;apagando=null;render();scrollTo(0,0);return}
  if(a==="pNovo"){pEdit=null;render();return}
  if(a==="pDel"){apagando=v;render();return}
  if(a==="pDelNao"){apagando=null;render();return}
  if(a==="pDelOk"){S.pessoas=S.pessoas.filter(x=>x.id!==v);apagando=null;if(pEdit===v)pEdit=null;save();render();toast("Cadastro excluído");return}
  if(a==="copiarBk"){const txt=JSON.stringify(S);const ok=()=>toast("Backup copiado. Agora cole no outro app, em Configurações.");
    const fb=()=>{const ta=$("#colaBk");ta.value=txt;ta.focus();ta.select();try{document.execCommand("copy");ok()}catch(e){toast("Selecionei o texto no campo abaixo. Copie manualmente.")}};
    try{navigator.clipboard.writeText(txt).then(ok,fb)}catch(e){fb()}return}
  if(a==="restTexto"){const v=$("#colaBk").value.trim();if(!v){toast("Cole o texto do backup no campo primeiro");return}
    try{const o=JSON.parse(v);if(!o||!Array.isArray(o.docs))throw 0;importando=o;render();scrollTo(0,document.body.scrollHeight)}catch(e){toast("Esse texto não é um backup válido deste app. Copie de novo, inteiro.")}return}
  if(a==="exportar"){try{const bl=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});const u=URL.createObjectURL(bl);const l=document.createElement("a");l.href=u;l.download=`igui-documentos-backup-${hoje()}.json`;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}catch(err){toast("Não foi possível baixar o arquivo aqui")}return}
  if(a==="impOk"&&importando){S=fixo({...seed(),...importando,cfg:{...CFG0,...importando.cfg}});importando=null;save();ORDEM.forEach(t=>rasc[t]=novoRasc(t));render();toast("Backup restaurado");return}
  if(a==="sAdd"){const n=$("#s_nome").value.trim();if(!n){$("#s_nome").closest(".fld").classList.add("err");toast("Informe o nome");return}
    S.signatarios.push({id:uid(),nome:n,cargo:$("#s_cargo").value.trim()});save();render();toast("Assinante adicionado");return}
  if(a==="sDel"){S.signatarios=S.signatarios.filter(x=>x.id!==v);save();ORDEM.forEach(t=>rasc[t]=novoRasc(t));render();toast("Assinante removido");return}
  if(a==="sPad"){const g=S.signatarios.find(x=>x.id===v);S.signatarios=[g,...S.signatarios.filter(x=>x.id!==v)];save();ORDEM.forEach(t=>{if(!rasc[t].exemplo)rasc[t]=novoRasc(t)});render();toast(`${g.nome} agora é o padrão`);return}
  if(a==="impNao"){importando=null;render();return}
});
document.addEventListener("input",e=>{const t=e.target;
  if(t.id==="busca"){busca=t.value;const pos=t.selectionStart;render();const s=$("#busca");s.focus();s.setSelectionRange(pos,pos);return}
  if(t.dataset.cfg){S.cfg[t.dataset.cfg]=t.value;save();return}
  if(view!=="novo")return;const d=cur();
  if(t.id==="d_data"){d.data=t.value;atualizaPrev();return}
  if(t.id==="d_local"){d.local=t.value;atualizaPrev();return}
  if(t.dataset.k){d.f[t.dataset.k]=t.value;delete d.exemplo;t.closest(".fld")?.classList.remove("err");if(t.hasAttribute("data-re")){render();return}atualizaPrev()}
});
document.addEventListener("change",e=>{const t=e.target;
  if(t.dataset.pessoa!==undefined&&view==="novo"){const d=cur(),p=S.pessoas.find(x=>x.id===t.value);d.f.pessoa=t.value;
    if(p){const ks=allFields(tipo).map(x=>x.k);d.f.nome=p.nome;if(ks.includes("cpf"))d.f.cpf=p.cpf;if(ks.includes("doc"))d.f.doc=p.cpf;if(ks.includes("cargo"))d.f.cargo=p.cargo;if(ks.includes("endereco")&&p.endereco)d.f.endereco=p.endereco;if(ks.includes("admissao")&&p.admissao)d.f.admissao=p.admissao}
    delete d.exemplo;render();return}
  if(t.dataset.sign!==undefined&&view==="novo"){const d=cur(),g=S.signatarios.find(x=>x.id===t.value);
    if(g){d.f.signNome=g.nome;d.f.signCargo=g.cargo}else{d.f.signNome="";d.f.signCargo=""}delete d.exemplo;render();return}
  if(t.id==="imp"&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!Array.isArray(o.docs))throw 0;importando=o;render()}catch(err){toast("Esse arquivo não é um backup válido deste app")}};r.readAsText(t.files[0])}
});
render();
</script>

</body></html>
